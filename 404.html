<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Philip Maina (@Kivice)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <style>
      :root {
        --bg: #080c14;
        --card: rgba(15, 23, 38, 0.85);
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: rgba(255, 255, 255, 0.1);
      }
      [data-theme="light"] {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
        --border: rgba(15, 23, 42, 0.1);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 48px 36px;
        max-width: 480px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .code {
        font-family: "Manrope", sans-serif;
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
      }
      h1 {
        font-family: "Manrope", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 10px;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.9rem;
        transition: transform 180ms ease, opacity 180ms ease;
      }
      .btn:hover {
        transform: translateY(-2px);
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist, has been moved, or the link may be broken.</p>
      <a class="btn" href="index.html">← Return to Portfolio</a>
    </div>
  </body>
</html>
