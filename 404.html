<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Philip Maina (@Kivice)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <style>
      :root {
        --bg: #f9f8f5;
        --card: #ffffff;
        --text: #141721;
        --muted: #475061;
        --accent: #1d4ed8;
        --border: #dfdad0;
      }

      [data-theme="dark"] {
        --bg: #0b0e14;
        --card: #121620;
        --text: #f0f4f9;
        --muted: #a8bad0;
        --accent: #38bdf8;
        --border: #222c3d;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 48px 36px;
        max-width: 460px;
        width: 100%;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--accent);
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .code {
        font-size: 4.5rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--text);
        margin-bottom: 12px;
      }

      .code span {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        color: var(--accent);
      }

      h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 10px;
      }

      p {
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 22px;
        border-radius: 8px;
        background: var(--text);
        color: var(--bg);
        text-decoration: none;
        font-weight: 700;
        font-size: 0.875rem;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
    <script>
      try {
        var saved = localStorage.getItem("philip-portfolio-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">HTTP STATUS // ROUTE MISS</div>
      <div class="code">4<span>0</span>4</div>
      <h1>Page Not Found</h1>
      <p>The page you requested doesn't exist, has been relocated, or the route is unavailable.</p>
      <a class="btn" href="index.html">← Return to Portfolio</a>
    </main>
  </body>
</html>
