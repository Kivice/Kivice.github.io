<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <defs>
    <linearGradient id="torus-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="torus-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <filter id="torus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(180, 180) rotate(25)" filter="url(#torus-glow)">
    <!-- Outer Ellipse Ring Shadow -->
    <ellipse cx="0" cy="0" rx="130" ry="65" fill="none" stroke="#7c2d12" stroke-width="26" opacity="0.6" />
    
    <!-- Torus Geometric Segments (Interlocking 3D Torus Knot) -->
    <!-- Back segments -->
    <path d="M -130 0 C -130 -45, -60 -75, 0 -75 C 60 -75, 130 -45, 130 0" fill="none" stroke="url(#torus-grad-2)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Inner Cross -->
    <path d="M -90 10 C -50 -40, 50 -40, 90 10" fill="none" stroke="#ea580c" stroke-width="22" stroke-linecap="round" opacity="0.8" />
    
    <!-- Front segments -->
    <path d="M -130 0 C -130 50, -60 85, 0 85 C 60 85, 130 50, 130 0" fill="none" stroke="url(#torus-grad-1)" stroke-width="32" stroke-linecap="round" />
    
    <!-- Floating mathematical orbit ring -->
    <ellipse cx="0" cy="0" rx="155" ry="40" fill="none" stroke="#fed7aa" stroke-width="2" stroke-dasharray="6,8" opacity="0.75" />
    
    <!-- Highlight nodes -->
    <circle cx="110" cy="28" r="6" fill="#fff" />
    <circle cx="-110" cy="-28" r="5" fill="#f97316" />
    <circle cx="0" cy="85" r="7" fill="#fed7aa" />
  </g>
</svg>
