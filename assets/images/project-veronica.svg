<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <linearGradient id="vr-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="vr-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(6,182,212,0.4)" />
      <stop offset="100%" stop-color="rgba(6,182,212,0)" />
    </linearGradient>
    <filter id="vr-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#vr-bg)" rx="16" />

  <!-- Background Waveform Grids -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <circle cx="300" cy="190" r="80" fill="none" />
    <circle cx="300" cy="190" r="140" fill="none" />
    <circle cx="300" cy="190" r="200" fill="none" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="300" y1="0" x2="300" y2="380" />
  </g>

  <!-- Desktop App Window Container -->
  <rect x="30" y="24" width="540" height="332" rx="12" fill="#0c121e" stroke="#253248" stroke-width="1" filter="url(#vr-shadow)" />
  
  <!-- Titlebar -->
  <rect x="30" y="24" width="540" height="38" rx="12" fill="#162235" />
  <rect x="30" y="50" width="540" height="12" fill="#162235" />
  <circle cx="50" cy="43" r="5" fill="#ef4444" />
  <circle cx="66" cy="43" r="5" fill="#f59e0b" />
  <circle cx="82" cy="43" r="5" fill="#10b981" />
  <text x="105" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">PROJECT VERONICA // NEURAL VOICE &amp; TELEMETRY ENGINE</text>
  <rect x="470" y="34" width="84" height="18" rx="9" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="0.8" />
  <circle cx="481" cy="43" r="3" fill="#06b6d4" />
  <text x="490" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#06b6d4">ACTIVE TTS</text>

  <!-- Left: Audio Spectrum Waveform Visualizer -->
  <rect x="52" y="80" width="310" height="150" rx="8" fill="#10192a" stroke="#1e2c44" stroke-width="1" />
  <text x="68" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">Speech Synthesis Stream</text>
  <text x="240" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#06b6d4">Microsoft Edge Neural</text>

  <!-- Animated Soundwave Bars -->
  <g fill="url(#vr-cyan)" transform="translate(68, 126)">
    <rect x="0" y="25" width="4" height="30" rx="2" />
    <rect x="8" y="18" width="4" height="44" rx="2" />
    <rect x="16" y="8" width="4" height="64" rx="2" />
    <rect x="24" y="2" width="4" height="76" rx="2" />
    <rect x="32" y="15" width="4" height="50" rx="2" />
    <rect x="40" y="28" width="4" height="24" rx="2" />
    <rect x="48" y="10" width="4" height="60" rx="2" />
    <rect x="56" y="0" width="4" height="80" rx="2" />
    <rect x="64" y="12" width="4" height="56" rx="2" />
    <rect x="72" y="22" width="4" height="36" rx="2" />
    <rect x="80" y="14" width="4" height="52" rx="2" />
    <rect x="88" y="4" width="4" height="72" rx="2" />
    <rect x="96" y="20" width="4" height="40" rx="2" />
    <rect x="104" y="30" width="4" height="20" rx="2" />
    <rect x="112" y="8" width="4" height="64" rx="2" />
    <rect x="120" y="2" width="4" height="76" rx="2" />
    <rect x="128" y="16" width="4" height="48" rx="2" />
    <rect x="136" y="26" width="4" height="28" rx="2" />
    <rect x="144" y="10" width="4" height="60" rx="2" />
    <rect x="152" y="5" width="4" height="70" rx="2" />
    <rect x="160" y="18" width="4" height="44" rx="2" />
    <rect x="168" y="24" width="4" height="32" rx="2" />
    <rect x="176" y="12" width="4" height="56" rx="2" />
    <rect x="184" y="2" width="4" height="76" rx="2" />
    <rect x="192" y="15" width="4" height="50" rx="2" />
    <rect x="200" y="22" width="4" height="36" rx="2" />
    <rect x="208" y="8" width="4" height="64" rx="2" />
    <rect x="216" y="14" width="4" height="52" rx="2" />
    <rect x="224" y="25" width="4" height="30" rx="2" />
    <rect x="232" y="18" width="4" height="44" rx="2" />
    <rect x="240" y="10" width="4" height="60" rx="2" />
    <rect x="248" y="2" width="4" height="76" rx="2" />
    <rect x="256" y="20" width="4" height="40" rx="2" />
    <rect x="264" y="26" width="4" height="28" rx="2" />
    <rect x="272" y="32" width="4" height="16" rx="2" />
  </g>

  <!-- CoreAudio Endpoint Bar -->
  <rect x="52" y="244" width="310" height="92" rx="8" fill="#10192a" stroke="#1e2c44" stroke-width="1" />
  <text x="68" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Windows CoreAudio Endpoint</text>
  <text x="320" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">78%</text>
  
  <rect x="68" y="280" width="278" height="6" rx="3" fill="#1e2c44" />
  <rect x="68" y="280" width="216" height="6" rx="3" fill="url(#vr-cyan)" />
  <circle cx="284" cy="283" r="6" fill="#38bdf8" />
  
  <text x="68" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Intent Parser: "Mute microphone and report memory allocation"</text>

  <!-- Right: Hardware Telemetry Column -->
  <rect x="378" y="80" width="176" height="256" rx="8" fill="#10192a" stroke="#1e2c44" stroke-width="1" />
  <text x="394" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">System Vitals</text>

  <!-- Metric 1: CPU -->
  <text x="394" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">CPU Load (Multi-core)</text>
  <text x="518" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981">14.2%</text>
  <rect x="394" y="140" width="144" height="4" rx="2" fill="#1e2c44" />
  <rect x="394" y="140" width="22" height="4" rx="2" fill="#10b981" />

  <!-- Metric 2: Memory -->
  <text x="394" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">RAM Allocated</text>
  <text x="506" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">3.4 GB</text>
  <rect x="394" y="180" width="144" height="4" rx="2" fill="#1e2c44" />
  <rect x="394" y="180" width="48" height="4" rx="2" fill="#38bdf8" />

  <!-- Metric 3: Audio Latency -->
  <text x="394" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Audio Stream Lag</text>
  <text x="520" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f59e0b">18 ms</text>
  <rect x="394" y="220" width="144" height="4" rx="2" fill="#1e2c44" />
  <rect x="394" y="220" width="32" height="4" rx="2" fill="#f59e0b" />

  <!-- Metric 4: Python Process -->
  <rect x="394" y="246" width="144" height="74" rx="6" fill="#162235" />
  <text x="406" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8">DAEMON STATUS</text>
  <text x="406" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Runtime: Python 3.13</text>
  <text x="406" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Socket: 127.0.0.1:8765</text>
</svg>

