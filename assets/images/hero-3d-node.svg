<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hero-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="hero-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="hero-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="hero-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="hero-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="hero-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow Blobs -->
  <circle cx="310" cy="270" r="140" fill="#f97316" opacity="0.12" filter="url(#hero-blur)" />
  <circle cx="420" cy="190" r="110" fill="#38bdf8" opacity="0.1" filter="url(#hero-blur)" />

  <!-- Isometric Base Grid -->
  <g transform="translate(310, 310) rotate(-22) skewX(25)" opacity="0.3" stroke="#94a3b8" stroke-width="1">
    <line x1="-220" y1="-140" x2="220" y2="-140" stroke-dasharray="4,4" />
    <line x1="-220" y1="-70" x2="220" y2="-70" stroke-dasharray="4,4" />
    <line x1="-220" y1="0" x2="220" y2="0" />
    <line x1="-220" y1="70" x2="220" y2="70" stroke-dasharray="4,4" />
    <line x1="-220" y1="140" x2="220" y2="140" stroke-dasharray="4,4" />
    
    <line x1="-140" y1="-180" x2="-140" y2="180" stroke-dasharray="4,4" />
    <line x1="-70" y1="-180" x2="-70" y2="180" stroke-dasharray="4,4" />
    <line x1="0" y1="-180" x2="0" y2="180" />
    <line x1="70" y1="-180" x2="70" y2="180" stroke-dasharray="4,4" />
    <line x1="140" y1="-180" x2="140" y2="180" stroke-dasharray="4,4" />
  </g>

  <!-- Floating Main Architecture Glass Card -->
  <g filter="url(#hero-shadow)">
    <!-- Base Plate -->
    <rect x="70" y="80" width="480" height="340" rx="20" fill="url(#hero-plate)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Header Bar -->
    <rect x="70" y="80" width="480" height="48" rx="20" fill="#1e293b" />
    <rect x="70" y="112" width="480" height="16" fill="#1e293b" />
    
    <!-- Controls -->
    <circle cx="102" cy="104" r="6" fill="#ef4444" />
    <circle cx="122" cy="104" r="6" fill="#f59e0b" />
    <circle cx="142" cy="104" r="6" fill="#10b981" />
    
    <text x="175" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">KIVICE.SYSTEMS // APPLIED MATHEMATICS &amp; ENGINE ARCHITECTURE</text>
    <rect x="444" y="93" width="86" height="22" rx="11" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1" />
    <circle cx="456" cy="104" r="3.5" fill="#f97316" />
    <text x="466" y="107.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f97316">ONLINE</text>

    <!-- Inside Left: Mathematical Vector & Function Analysis -->
    <rect x="96" y="148" width="230" height="160" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="112" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">Discrete Math &amp; Algorithmics</text>
    <text x="112" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Kirinyaga University · B.Sc Math &amp; CS</text>
    
    <!-- Graph Coordinate Lines -->
    <line x1="112" y1="264" x2="306" y2="264" stroke="#334155" stroke-width="1" />
    <line x1="112" y1="206" x2="112" y2="264" stroke="#334155" stroke-width="1" />
    
    <!-- Mathematical Spline Wave -->
    <path d="M 112 254 Q 136 210, 160 234 T 208 220 T 256 244 T 304 214" fill="none" stroke="url(#hero-orange-grad)" stroke-width="2.5" />
    <circle cx="304" cy="214" r="4" fill="#f97316" />

    <!-- Mathematical Formula Label -->
    <text x="112" y="288" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">f(x) = ∑ [W_i · x_i] + θ (Latency &lt; 28ms)</text>

    <!-- Inside Right: Engineering Telemetry Stack -->
    <rect x="340" y="148" width="186" height="74" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="356" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Bundle Payload</text>
    <text x="356" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#10b981">&lt; 35 KB</text>
    <text x="444" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Zero-Bloat</text>

    <rect x="340" y="234" width="186" height="74" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="356" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Execution Speed</text>
    <text x="356" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#f97316">~28 ms</text>
    <text x="444" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Vanilla DOM</text>

    <!-- Bottom Status Strip -->
    <rect x="96" y="324" width="430" height="66" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="124" cy="357" r="14" fill="#0f172a" />
    <text x="116" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#f97316">K</text>
    <text x="150" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Philip Maina (@Kivice)</text>
    <text x="150" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Nairobi, Kenya · Available for technical collaboration &amp; engineering</text>
  </g>

  <!-- Floating Floating Satellite Badge: 53+ Repos -->
  <g transform="translate(430, 40) rotate(4)" filter="url(#hero-shadow)">
    <rect width="160" height="56" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="1.5" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#f8fafc">53+ Repos</text>
    <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#f97316">github.com/Kivice ↗</text>
  </g>

  <!-- Floating Satellite Badge: Zero Framework Bloat -->
  <g transform="translate(30, 370) rotate(-4)" filter="url(#hero-shadow)">
    <rect width="180" height="52" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc">ZERO RUNTIME BLOAT</text>
    <text x="18" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#38bdf8">Pure HTML5 + Modern CSS + JS</text>
  </g>
</svg>

