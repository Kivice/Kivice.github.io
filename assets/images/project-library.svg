<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141c2f" />
    </linearGradient>
    <filter id="db-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#db-bg)" rx="16" />

  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
  </g>

  <rect x="26" y="24" width="548" height="332" rx="12" fill="#0c1322" stroke="#25344f" stroke-width="1" filter="url(#db-shadow)" />
  <rect x="26" y="24" width="548" height="38" rx="12" fill="#152038" />
  <rect x="26" y="50" width="548" height="12" fill="#152038" />

  <circle cx="46" cy="43" r="5" fill="#ef4444" />
  <circle cx="62" cy="43" r="5" fill="#f59e0b" />
  <circle cx="78" cy="43" r="5" fill="#10b981" />

  <rect x="102" y="34" width="262" height="18" rx="6" fill="#0b1120" />
  <text x="112" y="46.5" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Kivice/Library_Database_mangement</text>

  <rect x="444" y="34" width="112" height="18" rx="9" fill="rgba(56,189,248,0.14)" stroke="#38bdf8" stroke-width="0.8" />
  <text x="456" y="46.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8">3NF SQL SCHEMA</text>

  <!-- Foreign Key Relation Lines -->
  <path d="M 192 126 L 230 126 L 230 176 L 254 176" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 192 260 L 230 260 L 230 202 L 254 202" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 386 188 L 418 188" fill="none" stroke="#10b981" stroke-width="1.5" />
  <path d="M 486 226 L 486 254" fill="none" stroke="#f59e0b" stroke-width="1.5" />

  <!-- Table 1: Books -->
  <rect x="48" y="82" width="144" height="106" rx="6" fill="#111a2e" stroke="#243554" stroke-width="1" />
  <rect x="48" y="82" width="144" height="24" rx="6" fill="#1a2744" />
  <text x="60" y="98" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">Books</text>
  <text x="60" y="122" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0">PK bookID INT</text>
  <text x="60" y="138" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">title VARCHAR(255)</text>
  <text x="60" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">author VARCHAR(100)</text>
  <text x="60" y="170" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">ISBN CHAR(13) UQ</text>

  <!-- Table 2: Members -->
  <rect x="48" y="216" width="144" height="106" rx="6" fill="#111a2e" stroke="#243554" stroke-width="1" />
  <rect x="48" y="216" width="144" height="24" rx="6" fill="#1a2744" />
  <text x="60" y="232" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">Members</text>
  <text x="60" y="256" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0">PK memberID INT</text>
  <text x="60" y="272" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">fullName VARCHAR</text>
  <text x="60" y="288" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">email UNIQUE</text>
  <text x="60" y="304" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">joinDate DATE</text>

  <!-- Table 3: Loans (Center Junction Table) -->
  <rect x="254" y="128" width="132" height="124" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1" />
  <rect x="254" y="128" width="132" height="24" rx="6" fill="#1d4ed8" />
  <text x="266" y="144" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff">Loans (M:N)</text>
  <text x="266" y="168" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0">PK loanID INT</text>
  <text x="266" y="184" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7dd3fc">FK bookID -&gt; Books</text>
  <text x="266" y="200" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7dd3fc">FK memberID</text>
  <text x="266" y="216" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">loanDate / returnDate</text>
  <text x="266" y="234" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">status ENUM</text>

  <!-- Table 4: Transactions -->
  <rect x="418" y="114" width="136" height="112" rx="6" fill="#111a2e" stroke="#243554" stroke-width="1" />
  <rect x="418" y="114" width="136" height="24" rx="6" fill="#1a2744" />
  <text x="428" y="130" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10b981">Transactions</text>
  <text x="428" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0">PK transactionID</text>
  <text x="428" y="170" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7dd3fc">FK loanID ON DEL</text>
  <text x="428" y="186" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fbbf24">FK librarianID</text>
  <text x="428" y="204" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">action Issue/Return</text>

  <!-- Table 5: Librarians -->
  <rect x="418" y="254" width="136" height="74" rx="6" fill="#111a2e" stroke="#243554" stroke-width="1" />
  <rect x="418" y="254" width="136" height="22" rx="6" fill="#1a2744" />
  <text x="428" y="269" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f59e0b">Librarians</text>
  <text x="428" y="290" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0">PK librarianID INT</text>
  <text x="428" y="306" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">email UNIQUE · phone</text>
</svg>
