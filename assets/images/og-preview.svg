<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orbBlue" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152136" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0c1322" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="240" cy="180" r="450" fill="url(#orbBlue)" />
  <circle cx="980" cy="440" r="380" fill="url(#orbCyan)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.2">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Central Content Frame -->
  <g transform="translate(80, 75)">
    <!-- Brand / Status Pill -->
    <rect x="0" y="0" width="360" height="42" rx="21" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="22" cy="21" r="5" fill="#10b981" />
    <text x="36" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">GITHUB.COM/KIVICE · 53+ REPOS</text>

    <!-- Main Name Title -->
    <text x="0" y="130" font-family="'Manrope', system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Philip Maina</text>
    <text x="0" y="195" font-family="'Manrope', system-ui, sans-serif" font-size="34" font-weight="700" fill="#38bdf8">Software Developer &amp; Applied Mathematician</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="248" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#cbd5e1" font-weight="600">
      Kirinyaga University · BSc in Mathematics and Computer Science · Kenya
    </text>
    <text x="0" y="285" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" fill="#94a3b8">
      Building fast, zero-lag web platforms, desktop automation tools, and relational databases.
    </text>

    <!-- Featured Repository Cards (3 badges) -->
    <g transform="translate(0, 310)">
      <!-- Card 1: X Power -->
      <rect x="0" y="0" width="310" height="120" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">TYPESCRIPT · WEB</text>
      <text x="24" y="70" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#ffffff">X Power Program</text>
      <text x="24" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Job Matching Platform Kenya</text>

      <!-- Card 2: Veronica Mark-V -->
      <rect x="330" y="0" width="310" height="120" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="354" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a855f7">PYTHON · AI AGENT</text>
      <text x="354" y="70" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Project Veronica</text>
      <text x="354" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Tactical Desktop AI Agent</text>

      <!-- Card 3: Career-Ops -->
      <rect x="660" y="0" width="310" height="120" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="684" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10b981">GO &amp; CLAUDE · AUTO</text>
      <text x="684" y="70" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Career-Ops Search</text>
      <text x="684" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">14 Skill Modes Engine</text>
    </g>
  </g>
</svg>

